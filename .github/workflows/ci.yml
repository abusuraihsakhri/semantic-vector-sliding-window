name: Python tests and browser checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test extras
        run: python -m pip install -e ".[server,test]"
      - name: Check dependencies
        run: python -m pip check
      - name: Compile Python modules
        run: python -m compileall -q agents vector_window cli.py enrichment.py simulator.py
      - name: Run regression tests
        run: python -m pytest -q
      - name: Smoke test command-line entry point
        run: semantic-vector-sliding-window audit --task-id CI-TEST --primary 2 --secondary 1 --status NOMINAL
