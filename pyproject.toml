[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-vector-sliding-window"
version = "2.0.0"
description = "VectorWindow: Dynamic Semantic Chunking & Cosine Proximity Attention Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.100", "uvicorn>=0.23"]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
py-modules = ["cli", "enrichment", "simulator", "vector_window_app"]

[tool.setuptools.packages.find]
include = ["agents", "vector_window"]

[project.scripts]
semantic-vector-sliding-window = "vector_window.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/semantic-vector-sliding-window"
Repository = "https://github.com/abusuraihsakhri/semantic-vector-sliding-window.git"
