[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-vector-sliding-window"
version = "2.0.0"
description = "VectorWindow: Dynamic Semantic Chunking & Cosine Proximity Attention Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
semantic-vector-sliding-window = "vector_window.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/semantic-vector-sliding-window"
Repository = "https://github.com/abusuraihsakhri/semantic-vector-sliding-window.git"
